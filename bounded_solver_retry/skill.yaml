  rationale: 'The packet shows seven consecutive failures in the same mode: tier 6 single 112x112 boards at 05:40, 06:45, 07:27, 08:08, 08:53, 09:34 and 10:15 on 2026-10-30, each with CaDiCaL finding no solution by the deadline, 0/1 solved, no submit, no mint and no gas spent, while supply fell from 892 to 772 and the cooldown was corrected from about 15 minutes to about 30 minutes. The agent kept scheduling the next identical attempt and only at 10:15 asked whether to continue or stop, with no schedule then attached. No existing skill covers this gap: contested_seat_watcher covers classified retries and anti-hammering for seat capture, not solver time versus window, and nft-detail covers reporting detail, not a retry cap. The deterministic candidates were rejected for this proposal because the memory and goals_bookkeeping recurring failures and the shopping, memory and alignment handoff suppressions carry no solver failure detail that a skill could address. This single proposal is therefore the only change made, and it does not touch the unmanaged serok, nft-detail or riset-x files or the managed contested_seat_watcher skill still inside its measurement window.'
