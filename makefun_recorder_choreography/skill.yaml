  rationale: 'Repeated recorder failures with the same shapes across the window: cron launched recorder death at turn end, seal poisoning by parent collision, parallel build contamination, cron author turn budget, and the eight open cap blocking new recorders. The makefun bounty skill was read and verified to cover the fresh write protocol and bundle grep but no recorder launch or seal choreography, and skill search found no covering skill. The lessons sit in AGENTS.md as text, and the P-13 episode in this same window showed text alone repeats as failure until installed in the path that does the work, so this single new managed skill installs the choreography in a discoverable skill without touching the unmanaged makefun bounty file. Q-Day rate limit and cron timeouts map to the managed contested seat watcher still inside its measurement window. The devnet negative control episode, the saved login claim error, the alerted.json parser formats, and the LICENSE SPDX correction were each rejected as single or already codified shapes to keep attribution clean.'
