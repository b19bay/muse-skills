name: contested_seat_watcher
title: Contested Seat Watcher
description: Run an unattended watcher that captures a scarce seat or attempt and acts inside its window without silently stopping, hammering a blocked endpoint, or starting an attempt it cannot finish.
category: Personal planning
include_in_prompt: false
